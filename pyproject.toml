[build-system]
# Floors are per-interpreter (PEP 508 markers): each Python gets the newest
# release that still supports it, so building the sdist works everywhere the
# package claims to run. setuptools 84 and wheel 0.48 need Python >= 3.10/3.9.
requires = [
    "setuptools>=75.3.4; python_version < '3.9'",
    "setuptools>=82.0.1; python_version == '3.9'",
    "setuptools>=84.0.0; python_version >= '3.10'",
    "wheel>=0.45.1; python_version < '3.9'",
    "wheel>=0.48.0; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[project]
name = "inverge-nexus"
version = "1.4.0"
description = "Nexus — one Python SDK for all Inverge Nexus services (analytics, logs, errors, feature flags, remote config, realtime, push, surveys, voice). Works in Django, Flask, FastAPI, Celery and plain scripts."
readme = "README.md"
# The TOML-table form is deprecated in favour of the PEP 639 string, but that
# needs setuptools>=77, which drops Python 3.8 — and 3.8 deployments are exactly
# who a server SDK still has to reach. Revisit when we raise requires-python.
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Inverge", email = "info@inverge.net" }]
keywords = [
    "nexus", "inverge", "analytics", "feature-flags", "remote-config",
    "realtime", "logging", "error-monitoring", "push-notifications",
    "django", "flask", "fastapi", "celery", "sdk",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Flask",
    "Framework :: FastAPI",
    "Framework :: Celery",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Zero required runtime dependencies — the default transport is stdlib urllib.
dependencies = []

# Every floor is the newest release available for the interpreter in use.
# `requests`, `aiohttp` and `mypy` dropped older Pythons at different points, so
# each gets a PEP 508 marker per line: pip applies exactly one, and the extras
# stay installable on every Python this package supports. `httpx`,
# `python-socketio` and `ruff` still ship a single version for all of them.
[project.optional-dependencies]
requests = [
    "requests>=2.32.4; python_version < '3.9'",
    "requests>=2.32.5; python_version == '3.9'",
    "requests>=2.34.2; python_version >= '3.10'",
]
httpx = ["httpx>=0.28.1"]
aiohttp = [
    "aiohttp>=3.10.11; python_version < '3.9'",
    "aiohttp>=3.13.5; python_version == '3.9'",
    "aiohttp>=3.14.3; python_version >= '3.10'",
]
realtime = ["python-socketio[client]>=5.17.0"]
all = [
    "inverge-nexus[requests,httpx,realtime]",
]
dev = [
    "inverge-nexus[requests,httpx,aiohttp,realtime]",
    "mypy>=1.14.1; python_version < '3.9'",
    "mypy>=1.19.1; python_version == '3.9'",
    "mypy>=2.4.0; python_version >= '3.10'",
    "ruff>=0.16.10",
]

[project.urls]
Homepage = "https://nexus.inverge.net"
Documentation = "https://nexus.inverge.net"
Source = "https://github.com/Inverge-team/nexus-python"
Issues = "https://github.com/Inverge-team/nexus-python/issues"

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.setuptools.package-data]
nexus = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py38"

[tool.mypy]
python_version = "3.8"
warn_unused_ignores = true
ignore_missing_imports = true
